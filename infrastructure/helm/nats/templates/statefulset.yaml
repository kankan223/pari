{{- $natsName := .Chart.Name -}}

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $natsName }}
spec:
  serviceName: {{ $natsName }}-headless
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: {{ $natsName }}
  template:
    metadata:
      labels:
        app: {{ $natsName }}
    spec:
      securityContext:
        runAsUser: {{ .Values.securityContext.runAsUser }}
        runAsNonRoot: {{ .Values.securityContext.runAsNonRoot }}
        fsGroup: 1001
      containers:
      - name: {{ $natsName }}
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        securityContext:
          readOnlyRootFilesystem: {{ .Values.securityContext.readOnlyRootFilesystem }}
          allowPrivilegeEscalation: {{ .Values.securityContext.allowPrivilegeEscalation }}
        command: ["/bin/sh", "-ec"]
        args:
          - |
            CONF=/conf/nats-server.conf
            cp /etc/nats/nats-server.conf "$CONF"
            # Optional auth: append a user block when a secret is configured.
            if [ -n "$NATS_AUTH_PASSWORD" ]; then
              printf '\nauthorization {\n  users = [\n    { user: "%s", password: "%s" }\n  ]\n}\n' \
                "$NATS_AUTH_USER" "$NATS_AUTH_PASSWORD" >> "$CONF"
            fi
            exec nats-server --config "$CONF" --jetstream --store_dir {{ .Values.jetstream.store_dir }}
        {{- if .Values.existingSecret }}
        env:
        - name: NATS_AUTH_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Values.existingSecret }}
              key: {{ .Values.authPasswordKey }}
        - name: NATS_AUTH_USER
          value: {{ .Values.authUser }}
        {{- end }}
        ports:
        - name: client
          containerPort: {{ .Values.ports.client }}
        - name: monitor
          containerPort: {{ .Values.ports.monitor }}
        # Probes hit the NATS monitoring healthz endpoint (JetStream is
        # healthy once the server answers). K8s does not expand $(VAR) in
        # exec.args — the probe is a plain call, no secret involved.
        livenessProbe:
          exec:
            command: ["wget", "-q", "-O", "-", "http://127.0.0.1:{{ .Values.ports.monitor }}/healthz"]
          initialDelaySeconds: 15
          periodSeconds: 10
        readinessProbe:
          exec:
            command: ["wget", "-q", "-O", "-", "http://127.0.0.1:{{ .Values.ports.monitor }}/healthz"]
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
        volumeMounts:
        - name: config
          mountPath: /etc/nats/nats-server.conf
          subPath: nats-server.conf
          readOnly: true
        - name: conf
          mountPath: /conf
        - name: data
          mountPath: /data
      volumes:
      - name: config
        configMap:
          name: {{ $natsName }}-config
      - name: conf
        emptyDir: {}
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: [{{ .Values.persistence.accessMode }}]
      {{- if .Values.persistence.storageClass }}
      storageClassName: {{ .Values.persistence.storageClass }}
      {{- end }}
      resources:
        requests:
          storage: {{ .Values.persistence.size }}
