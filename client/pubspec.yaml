name: civic_commons
description: "Civic Commons Flutter Application - Local-First & Zero-Knowledge"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.2

  # Security & Storage Layer
  libsignal_protocol_dart: ^0.4.0
  sqflite_sqlcipher: ^3.0.0
  flutter_secure_storage: ^9.0.0
  hive_flutter: ^2.0.0
  workmanager: ^0.5.0
  flutter_dotenv: ^5.0.0
  
  # Cryptography
  argon2_dart: ^1.0.0
  convert: ^3.1.1
  cryptography: ^2.0.5

  # Device & Media
  geolocator: ^11.0.0
  geocoding: ^3.0.0
  just_audio: ^0.9.0
  record: ^5.0.0
  image_gallery_saver: ^2.0.3
  connectivity_plus: ^5.0.0

  # UI / UX
  google_fonts: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  test_api: ^0.7.0 # for coverage checks

flutter:
  uses-material-design: true
  assets:
    - assets/
