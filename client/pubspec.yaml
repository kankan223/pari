name: civic_commons
description: "Civic Commons Flutter Application - Local-First & Zero-Knowledge"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.2

  # Security & Storage Layer
  libsignal_protocol_dart: ^0.8.0
  sqflite_sqlcipher: ^3.0.0
  flutter_secure_storage: ^9.0.0
  # hive_flutter was discontinued (no Dart 3 support); hive_ce_flutter is the
  # maintained community fork with the same API (offline Hive boxes, Phase 3)
  hive_ce_flutter: ^2.3.4
  workmanager: ^0.5.0
  flutter_dotenv: ^5.0.0
  
  # Cryptography
  convert: ^3.1.1
  # Argon2id (RFC 9106) requires cryptography >= 2.7.0
  cryptography: ^2.7.0

  # Device & Media
  geolocator: ^11.0.0
  geocoding: ^3.0.0
  just_audio: ^0.9.0
  record: ^5.0.0
  image_gallery_saver: ^2.0.3
  connectivity_plus: ^5.0.0

  # UI / UX
  google_fonts: ^6.0.0

  path: any
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  test_api: ^0.7.0 # for coverage checks
  fake_async: ^1.3.1 # debounced network listener tests (Task 5.1)

flutter:
  uses-material-design: true
