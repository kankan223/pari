# Gitleaks Configuration for Civic Commons
# This configuration detects secrets, API keys, and credentials in code

title = "Civic Commons Secret Detection"

# Extend the default gitleaks config
[extend]
useDefault = true

# Allowlist for known false positives
[allowlist]
description = "Global allowlist"
paths = [
  '''node_modules''',
  '''.git''',
  '''build''',
  '''dist''',
  '''vendor''',
  '''\.terraform''',
  '''coverage''',
  '''\.dart_tool''',
  '''\.flutter-plugins''',
]

# Custom rules for Civic Commons-specific patterns
[[rules]]
description = "Civic Commons API Key Pattern"
id = "civic-api-key"
regex = '''(?i)(civic[_-]?(api|secret|token)[_-]?key)\s*[:=]\s*['\"]?[a-zA-Z0-9._-]{20,}['\"]?'''
secretGroup = 1
entropy = 3.5
keywords = [
    "civic",
    "api",
    "key",
    "secret",
    "token",
]

[[rules]]
description = "HashiCorp Vault Token"
id = "vault-token"
regex = '''(?i)(vault[_-]?token)\s*[:=]\s*['\"]?[a-zA-Z0-9._-]{20,}['\"]?'''
secretGroup = 1
entropy = 3.5
keywords = [
    "vault",
    "token",
]

[[rules]]
description = "PostgreSQL Connection String"
id = "postgres-connection"
regex = '''postgres(?:ql)?://[a-zA-Z0-9._-]+:[a-zA-Z0-9._-]+@[a-zA-Z0-9._-]+:[0-9]+/[a-zA-Z0-9._-]+'''
entropy = 3.0
keywords = [
    "postgres",
    "postgresql",
]

