loki:
  auth_enabled: false
  persistence:
    enabled: true
    size: 10Gi
promtail:
  enabled: true
  config:
    snippets:
      pipelineStages:
        - match:
            selector: '{app="civic-commons"}'
            stages:
              - replace:
                  expression: '(?:[\+]?[(]?[0-9]{1,3}[)]?[-\s\.]?[0-9]{3}[-\s\.]?[0-9]{4,6})'
                  replace: '[REDACTED_PHONE]'
              - replace:
                  expression: '([a-zA-Z0-9_\-\.\+]+)@([a-zA-Z0-9_\-\.]+)\.([a-zA-Z]{2,5})'
                  replace: '[REDACTED_EMAIL]'
              - replace:
                  expression: '(bh_[a-zA-Z0-9]{32})'
                  replace: '[REDACTED_BLIND_HASH]'
