# Civic Commons — PostgreSQL client authentication (Task 4.5)
# ============================================================
# Minimal, principle-of-least-privilege access policy. Replication traffic
# only from the database private network; application traffic only for the
# civic_app role (never the superuser).

# TYPE    DATABASE        USER              ADDRESS          METHOD
local     all             postgres                            peer

# Application role (identity/relay services) — database private network.
host      all             civic_app         10.0.1.0/24      scram-sha-256

# Streaming replication from the two standbys.
host      replication     civic_replicator  10.0.1.0/24      scram-sha-256

# Vault / admin host (10.0.1.20) for operational access only.
host      all             postgres          10.0.1.20        scram-sha-256

# Explicitly deny everything else (default deny).
host      all             all               0.0.0.0/0        reject
host      all             all               ::/0             reject
