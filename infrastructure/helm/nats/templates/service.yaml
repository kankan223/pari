{{- $natsName := .Chart.Name -}}

# Client service: applications connect to nats://nats:4222.
apiVersion: v1
kind: Service
metadata:
  name: {{ $natsName }}
  labels:
    app: {{ $natsName }}
spec:
  clusterIP: None
  selector:
    app: {{ $natsName }}
  ports:
  - name: client
    port: {{ .Values.ports.client }}
    targetPort: {{ .Values.ports.client }}

---
# Headless service: stable per-pod DNS for future clustering + monitoring.
apiVersion: v1
kind: Service
metadata:
  name: {{ $natsName }}-headless
  labels:
    app: {{ $natsName }}
spec:
  clusterIP: None
  selector:
    app: {{ $natsName }}
  ports:
  - name: client
    port: {{ .Values.ports.client }}
    targetPort: {{ .Values.ports.client }}
