# Civic Commons — PostgreSQL PRIMARY configuration (Task 4.5)
# ============================================================
# Applied on the primary database node (10.0.1.10, the first of the three
# database_nodes created in kubernetes.tf). The two standbys (10.0.1.11,
# 10.0.1.12) use postgresql-standby.conf.
#
# Covers: streaming replication to two standbys (synchronous commit),
# WAL archiving to MinIO for Point-in-Time Recovery, and observability.

listen_addresses = '*'
port = 5432

# --- Resources --------------------------------------------------------------
max_connections = 200
shared_buffers = 4GB
effective_cache_size = 12GB
maintenance_work_mem = 1GB
work_mem = 5242kB
wal_buffers = 16MB
min_wal_size = 1GB
max_wal_size = 4GB
checkpoint_completion_target = 0.9
random_page_cost = 1.1

# --- Streaming replication (1 primary → 2 standbys) ------------------------
wal_level = replica
hot_standby = on
max_wal_senders = 3            # exactly one slot per standby
max_replication_slots = 3
wal_keep_size = 1GB            # cushion while standbys catch up
# Synchronous commit: every committed transaction is durably on ≥1 standby
# before the client is acknowledged (zero data-loss window).
synchronous_commit = on
synchronous_standby_names = 'ANY 1 (civic_standby_1, civic_standby_2)'

# --- WAL archiving to MinIO (Point-in-Time Recovery) ------------------------
# Each WAL segment is pushed to the MinIO S3 bucket by archive_command. The
# script also performs periodic base backups (see wal-archive-to-minio.sh and
# infrastructure/security/postgres-wal-backup.yaml).
archive_mode = on
archive_command = '/usr/local/bin/wal-archive-to-minio.sh %p %f'
archive_timeout = 300          # flush a segment every 5 min even if idle

# --- Observability -----------------------------------------------------------
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.max = 10000
pg_stat_statements.track = all

# --- Logging (PII-safe: SQL statements never include raw phone numbers —     #
# the identity layer stores only blind hashes; keep query logging off in prod)#
log_min_duration_statement = 1000
log_connections = off
log_disconnections = off
