# Civic Commons — PostgreSQL STANDBY configuration (Task 4.5)
# ============================================================
# Applied on the two standby nodes (10.0.1.11, 10.0.1.12).
#
# Bootstrap a standby from the primary:
#   sudo -u postgres pg_basebackup -h 10.0.1.10 -U civic_replicator \
#       -D /var/lib/postgresql/14/main -R -P -X stream
#   touch /var/lib/postgresql/14/main/standby.signal
#   systemctl restart postgresql
#
# `-R` writes the primary_conninfo into postgresql.auto.conf; `standby.signal`
# puts the node in hot-standby mode. Replication traffic is authorized by the
# pg_hba.conf entry for civic_replicator.

listen_addresses = '*'
port = 5432

max_connections = 200
shared_buffers = 4GB
effective_cache_size = 12GB
maintenance_work_mem = 1GB
wal_buffers = 16MB

# --- Hot standby -------------------------------------------------------------
hot_standby = on
max_standby_streaming_delay = 30s
max_standby_archive_delay = 30s
hot_standby_feedback = on

# --- Replication source ------------------------------------------------------
# Written automatically by `pg_basebackup -R` into postgresql.auto.conf:
#   primary_conninfo = 'host=10.0.1.10 port=5432 user=civic_replicator ...'
#   primary_slot_name = 'civic_standby_1'   (create the slot on the primary)
#
# Slot names must match synchronous_standby_names on the primary:
#   node 1 → civic_standby_1, node 2 → civic_standby_2.
# Create them on the primary once:
#   SELECT pg_create_physical_replication_slot('civic_standby_1');
#   SELECT pg_create_physical_replication_slot('civic_standby_2');

# --- Observability -----------------------------------------------------------
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.max = 10000
pg_stat_statements.track = all
